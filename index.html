<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>inicio-Biblionet</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <nav>
      <h1>
        <a href="index.html">Biblionet</a>
      </h1>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="index.html#catalogo_productos">Catalogo</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
      <div>
        <a href="carrito.html">Carrito</a>
        <a href="cuenta.html">Mi cuenta</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="filtros">
      <h2>Filtros</h2>
      <form id="form_filtros">
        <fieldset>
          <legend>Género</legend>
          <label for="filtro_genero">Buscar por género:</label>
          <input type="text" id="filtro_genero" name="genero" list="lista_generos"
            placeholder="Escribí o seleccioná un género...">

          <datalist id="lista_generos">
            <option value="Aventura">
            <option value="Autoayuda">
            <option value="Ciencia Ficción">
            <option value="Clásico">
            <option value="Desarrollo Profesional">
            <option value="Épica">
            <option value="Esoterismo">
            <option value="Espiritualidad">
            <option value="Fábula">
            <option value="Fantasía">
            <option value="Ficción">
            <option value="Filosofía">
            <option value="Literatura Infantil">
            <option value="Literatura Juvenil">
            <option value="Motivación">
            <option value="Negociación">
            <option value="Novela Contemporánea">
            <option value="Psicología">
          </datalist>
        </fieldset>
      </form>
    </section>

    <section class="productos" id="catalogo_productos">
      <h2>Catalogo</h2>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 E-Commerce - Proyecto Universitario</p>
  </footer>

  <script src="biblionet.js" defer></script>
</body>

</html>
